<!doctype html>
<html lang="es-PA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Socios D'CASA</title>
<meta name="description" content="El programa de puntos de D'CASA Panamá. Suma comprando, suma invitando, y cámbialos por lo que quieras de la tienda.">
<meta name="theme-color" content="#1340B1">
<link rel="icon" href="hub/assets/logo-dcasa.png">
<!-- «Añadir a pantalla de inicio». Para este público es la diferencia entre
     volver y no volver: un icono en el teléfono se toca, un enlace guardado en
     el navegador se pierde.

     SIN service worker, y es deliberado. Un caché mal hecho enseñando un saldo
     viejo es peor que no tener app: el socio vería puntos que ya gastó y
     llegaría a la tienda a pedir un premio que no puede pagar. -->
<link rel="manifest" href="hub/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="D'CASA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500&family=Inter:wght@400;500&display=swap">
<style>
  /* Los hex salen de datos/marca.json y de ningún otro sitio.
     herramientas/verificar.mjs lo comprueba antes de construir. */
  :root {
    --azul: #1340B1;
    --amarillo: #FED00F;
    --blanco: #FFFFFF;
    --hueso: #EDEAE0;
    --tinta: #141C2E;
    --apagado: #6E7686;
    --borde: #E1DDD1;
    --radio: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--hueso);
    color: var(--tinta);
    font-family: Inter, system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* Masa azul arriba, como manda el sistema de logo de la marca. */
  header { background: var(--azul); padding: 32px 20px 44px; text-align: center; }
  /* El logo va DIRECTAMENTE sobre el azul, sin ninguna placa nuestra detrás.
     El archivo ya trae la suya: el manual de marca dice que «el logo ES la
     placa» —marco blanco de esquinas redondeadas, borde azul fino, masa azul
     con D'CASA y banda amarilla con PANAMÁ—, todo montado dentro del PNG.

     Hubo una placa blanca de CSS aquí, puesta para que el azul del archivo no
     tocara el azul del fondo (no son el mismo; ver `logo.$divergencia` en
     datos/marca.json). Sobraba: ese marco blanco propio del logo YA es el
     espacio de resguardo, y los dos azules nunca llegan a tocarse. Lo único
     que añadía era un segundo marco blanco alrededor del primero. */
  .placa-logo { display: inline-block; }
  /* `inline-block` en la envoltura y no solo `block` en la imagen: el centrado
     del cabecero es `text-align`, que alinea contenido en línea. Con la imagen
     en `block` y sin esta envoltura, se convierte en una caja de bloque de
     170 px que `text-align` no toca, y se queda pegada a la izquierda. */
  .placa-logo img { display: block; width: 170px; height: auto; }

  main { flex: 1; width: 100%; max-width: 520px; margin: 0 auto; padding: 0 16px 48px; }

  .tarjeta {
    background: var(--blanco);
    border: 1px solid var(--borde);
    border-radius: var(--radio);
    padding: 24px 20px;
    margin-top: 16px;
  }
  main > div > .tarjeta:first-child, main > form:first-child, main > div.tarjeta:first-child {
    margin-top: -28px;
  }
  .tarjeta.centrada { text-align: center; }

  h1 {
    font-family: Anton, Inter, sans-serif;
    font-weight: 400;
    text-transform: uppercase;
    font-size: 30px;
    line-height: 1.04;
    letter-spacing: 0.01em;
    margin: 0 0 14px;
    color: var(--azul);
  }
  .antetitulo {
    font-family: Oswald, Inter, sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 12px;
    color: var(--apagado);
    margin: 0 0 8px;
  }
  p { margin: 0 0 14px; }
  .nota { color: var(--apagado); font-size: 15px; }
  .invita { background: var(--hueso); border-radius: 10px; padding: 10px 14px; font-size: 15px; }

  /* El saldo: lo que el socio viene a ver.
     Placa AMARILLA con texto AZUL — 5.9:1, AA. Amarillo sobre blanco da 1.47:1
     y está prohibido. */
  .placa {
    background: var(--amarillo);
    color: var(--azul);
    border-radius: var(--radio);
    padding: 20px 16px 16px;
    margin: 6px 0 14px;
  }
  .placa .numero {
    display: block;
    font-family: Anton, Inter, sans-serif;
    font-size: 62px;
    line-height: 0.92;
    letter-spacing: 0.01em;
  }
  .placa .unidad {
    display: block;
    font-family: Oswald, Inter, sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-size: 13px;
    margin-top: 6px;
  }
  .codigo { font-size: 15px; color: var(--apagado); margin: 0; }
  /* El código, para compartir. Monoespaciado y espaciado: se lee en voz alta y
     se teclea desde una pantalla rayada. */
  .codigo-grande {
    display: block;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 30px;
    letter-spacing: 0.14em;
    font-weight: 500;
  }
  .enlace-copiable {
    width: 100%;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 14px;
    padding: 11px 12px;
    border: 1px solid var(--borde);
    border-radius: 10px;
    background: var(--hueso);
    color: var(--tinta);
    text-align: center;
  }
  .codigo b { color: var(--tinta); font-family: ui-monospace, Menlo, monospace; letter-spacing: 0.06em; }

  /* Formularios. Los campos van a 17px o más: por debajo, Safari en iPhone
     hace zoom solo al enfocarlos y descoloca la pantalla entera. */
  .campo { display: block; margin-bottom: 16px; }
  .campo .etiqueta {
    display: block;
    font-family: Oswald, Inter, sans-serif;
    font-size: 14px;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }
  .campo input {
    width: 100%;
    font-family: inherit;
    font-size: 17px;
    padding: 13px 14px;
    border: 1px solid var(--borde);
    border-radius: 10px;
    background: var(--blanco);
    color: var(--tinta);
  }
  .campo input:focus { outline: 3px solid var(--azul); outline-offset: 1px; border-color: var(--azul); }
  .campo .nota { display: block; margin-top: 5px; font-size: 13px; }

  /* El selector de cumpleaños: dos listas, un toque cada una.
     Ver `hub/cumple.js` para el porqué de que no sea un calendario. */
  .cumple-fila { display: flex; gap: 10px; }
  .cumple-parte {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 17px;
    /* 48px de alto mínimo: es un objetivo que se toca con el pulgar, de pie. */
    padding: 13px 12px;
    border: 1px solid var(--borde);
    border-radius: 10px;
    background: var(--blanco);
    color: var(--tinta);
    /* La flecha nativa de Android ocupa y desalinea; se pinta una propia. */
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--azul) 50%),
                      linear-gradient(135deg, var(--azul) 50%, transparent 50%);
    background-position: right 18px center, right 13px center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    padding-right: 32px;
  }
  .cumple-parte:focus { outline: 3px solid var(--azul); outline-offset: 1px; border-color: var(--azul); }
  /* La fecha releída en palabras. Vacía no ocupa: sin esto el formulario da un
     salto de un renglón la primera vez que se elige un día. */
  .cumple-leido:not(:empty) { display: block; margin-top: 6px; font-weight: 500; color: var(--azul); }

  .casilla { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; margin: 4px 0 18px; }
  .casilla input { width: 22px; height: 22px; margin-top: 2px; flex: none; accent-color: var(--azul); }
  .casilla a { color: var(--azul); }

  /* El botón de acción: fondo amarillo con texto AZUL. */
  .boton {
    display: block;
    width: 100%;
    text-align: center;
    background: var(--amarillo);
    color: var(--azul);
    text-decoration: none;
    font-family: Oswald, Inter, sans-serif;
    font-weight: 500;
    font-size: 16px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 15px 18px;
    border-radius: var(--radio);
    border: 2px solid var(--azul);
    margin-top: 12px;
    cursor: pointer;
  }
  .boton.secundario { background: transparent; }
  .boton[disabled] { opacity: 0.55; cursor: progress; }

  .fila {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: 0;
    border-bottom: 1px solid var(--borde);
    padding: 15px 2px;
    font: inherit;
    color: var(--azul);
    text-decoration: none;
    cursor: pointer;
  }
  .fila:last-child { border-bottom: 0; }

  .enlace { display: block; text-align: center; color: var(--azul); font-size: 15px; margin-top: 14px; }

  .aviso {
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 15px;
    margin: 14px 0 0;
  }
  /* El rojo de alarma no existe en esta marca: los stickers rojos son el
     mercado del que D'CASA se separa. Un error se marca con el azul de la casa
     y un borde grueso, que se ve igual de bien y no contradice el logo. */
  .aviso.malo { background: var(--hueso); border-left: 5px solid var(--azul); color: var(--tinta); }

  .premios { list-style: none; padding: 0; margin: 0; }
  .premios li { border-bottom: 1px solid var(--borde); padding: 14px 0; }
  .premios li:last-child { border-bottom: 0; }
  /* Los que no alcanza salen atenuados pero VISIBLES: son el motivo para
     volver. Esconderlos quitaría lo único que empuja a seguir sumando. */
  .premios li.lejos { opacity: 0.55; }
  /* `block` y no el `inline` que hereda de .cuando: si no, la descripción y el
     «te faltan» salen pegados en la misma línea —«…próxima compra.Te faltan
     360»— y parece un error de tecleo. */
  .premios li .cuando { display: block; }
  .faltan { display: block; font-size: 14px; color: var(--apagado); margin-top: 8px; }
  .boton.chico { width: auto; display: inline-block; padding: 9px 18px; font-size: 14px; margin-top: 8px; }

  .bitacora { list-style: none; padding: 0; margin: 0; }
  .bitacora li { border-bottom: 1px solid var(--borde); padding: 13px 0; }
  .bitacora li:last-child { border-bottom: 0; }
  .linea { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .que { font-family: Oswald, Inter, sans-serif; font-size: 16px; }
  .puntos { font-family: Anton, Inter, sans-serif; font-size: 19px; white-space: nowrap; }
  .puntos.suma { color: var(--azul); }
  .puntos.resta { color: var(--apagado); }
  .cuando { font-size: 13px; color: var(--apagado); }
  .motivo { font-size: 14px; color: var(--tinta); background: var(--hueso); border-radius: 8px; padding: 8px 11px; margin: 8px 0 0; }

  /* Banda amarilla de base: el amarillo sostiene, nunca flota. */
  footer {
    background: var(--amarillo);
    color: var(--azul);
    text-align: center;
    padding: 16px 20px;
    font-family: Oswald, Inter, sans-serif;
    font-size: 13px;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>

<header>
  <span class="placa-logo"><img src="hub/assets/logo-dcasa.png" alt="D'CASA Panamá" width="1783" height="809"></span>
</header>

<main id="app"></main>

<footer>D'CASA Panamá · La Chorrera, frente al parque Libertadores</footer>

<script type="module" src="socio/app.js"></script>
</body>
</html>
