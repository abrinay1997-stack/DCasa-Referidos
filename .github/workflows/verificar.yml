# Lo mismo que corre antes de construir, en cada push y en cada PR.
#
# No despliega. Desplegar desde CI exigiría un token de Cloudflare guardado en
# el repositorio, y mientras esto lo publique una persona desde su terminal no
# hace falta esa llave dando vueltas.

name: Verificar

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Va primero y sin depender de nada: si la marca se desincronizó o se
      # coló una columna `saldo`, se sabe en tres décimas.
      - name: La marca y las invariantes
        run: npm run verificar

      - name: Las reglas del dinero
        run: npm test

      - name: El Worker compila
        run: npm run tipos

      - name: Se puede construir
        run: npm run build
