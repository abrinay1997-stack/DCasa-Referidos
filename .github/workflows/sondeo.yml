# Preguntarle a lo publicado qué pieza suya está rota.
#
# ── PARA QUÉ ───────────────────────────────────────────────────────────────
#
# Las pruebas del repositorio corren contra una base local y un runtime local.
# Hay fallos que solo existen en producción —un secreto que falta, un límite de
# la cuenta, una migración que no llegó, una función de la plataforma que en
# local hace una cosa y arriba otra— y ninguno deja huella en el flujo: sale
# todo verde y lo publicado no funciona.
#
# Eso pasó. El dueño llenó el formulario de registro de su propia app, con sus
# datos, y recibió «Algo falló de nuestro lado». Las mismas peticiones, byte a
# byte, funcionaban en local.
#
# Así que esto llama a lo publicado desde fuera, como lo llamaría un cliente
# con su teléfono. Corre solo después de cada despliegue (`entregar.yml` lo
# usa) y también a mano, cuando uno quiera, sin tocar el Worker.
#
# ── CADA LLAMADA AÍSLA UNA PIEZA ───────────────────────────────────────────
#
#   · el pulso y los términos     el Worker corre y lee sus reglas. Ninguna de
#                                 las dos toca la base ni deriva nada.
#   · el padrino de un código     la BASE contesta. No deriva ningún PIN.
#   · entrar sin número           se DERIVA UN PIN. No toca la base: con el
#                                 teléfono vacío, `entrar` salta la consulta y
#                                 va directo al señuelo.
#   · entrar con un número        las dos cosas juntas, que es lo que hace de
#                                 verdad un cliente en el mostrador.
#   · el panel                    que NO conteste 200 sin pasar por Access.
#
# Si la tercera pasa y la cuarta no, el problema es derivar el PIN. Si es al
# revés, es la base. Si fallan las dos, es el Worker entero. Eso es lo que no
# se puede averiguar mirando el repositorio.
#
# ── NO ESCRIBE NADA, Y NO ES CASUALIDAD ────────────────────────────────────
#
# Dar de alta a un socio de mentira en cada despliegue ensucia la base del
# negocio y obliga a borrarlo después, que es otra cosa que puede fallar y
# dejar basura. `entrar` con un número desconocido hace el mismo trabajo caro
# que registrarse —deriva un PIN completo contra un señuelo, a propósito, para
# que el reloj no diga lo que el mensaje calla— y no escribe nada.
#
# El número es `00000000`: no empieza por [234567], así que `telefonoValido` lo
# rechaza y NINGUNA ficha puede tenerlo. Con un celular real corríamos el
# riesgo de sumarle un intento fallido a alguien, y a los cinco su cuenta se
# bloquea sola.
#
# El código es `DCAZZZZZZ`: tiene la forma buena —si no, la ruta contesta sin
# mirar la base y no probaría nada— y no es el de nadie.

name: Sondear lo publicado

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sondear:
    name: Qué contesta cada pieza
    runs-on: ubuntu-latest
    steps:
      - name: Preguntar
        env:
          SITIO: https://dcasa-socios.abrinay1997.workers.dev
        run: |
          set -u
          fallos=0

          # El resumen se escribe a la vez que la salida, y NO con una tubería.
          # Un `{ ... } | tee` mete el bloque en una subshell, y ahí `fallos` se
          # incrementa en una copia que muere con ella: el sondeo imprimía las
          # cruces rojas y terminaba en verde. Un guardia que no puede fallar no
          # es un guardia.
          di() {
            echo "$1"
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
          }

          # ── POR QUÉ REINTENTA ──────────────────────────────────────────
          #
          # Publicar no es instantáneo: `wrangler deploy` vuelve cuando Cloudflare
          # ha aceptado el Worker, no cuando todos los bordes lo sirven. Durante
          # unos segundos hay peticiones que caen en la versión vieja y peticiones
          # que caen en la nueva.
          #
          # Sondear en ese hueco da cruces rojas que no significan nada, y una
          # cruz roja que no significa nada enseña al equipo a no mirar las cruces
          # rojas — que es justo lo que no puede pasar el día que una sea de
          # verdad.
          #
          # Así que cada llamada se reintenta hasta tres veces, con seis segundos
          # de espera. Un fallo son TRES fallos repartidos en veinte segundos, y
          # los intentos que no cuadraron se imprimen igual: si algo falla de vez
          # en cuando, queda escrito aunque acabe pasando.
          INTENTOS=3
          ESPERA=6

          mirar() {
            nombre="$1"; esperado="$2"; metodo="$3"; ruta="$4"; cuerpo="${5:-}"

            intento=1
            while : ; do
              if [ -n "$cuerpo" ]; then
                estado=$(curl -sS -o /tmp/r -w '%{http_code}' --max-time 40 \
                  -X "$metodo" -H 'Content-Type: application/json' --data "$cuerpo" \
                  "$SITIO$ruta" || echo 000)
              else
                estado=$(curl -sS -o /tmp/r -w '%{http_code}' --max-time 40 \
                  -X "$metodo" "$SITIO$ruta" || echo 000)
              fi

              [ "$estado" = "$esperado" ] && break
              [ "$intento" -ge "$INTENTOS" ] && break

              di "   … $nombre — intento $intento contestó $estado, reintentando"
              di "     $(head -c 300 /tmp/r)"
              intento=$((intento + 1))
              sleep "$ESPERA"
            done

            if [ "$estado" = "$esperado" ]; then
              if [ "$intento" -gt 1 ]; then
                di "✅ $nombre — $estado (al intento $intento)"
              else
                di "✅ $nombre — $estado"
              fi
            else
              di "❌ $nombre — esperaba $esperado y contestó $estado en $INTENTOS intentos"
              fallos=$((fallos + 1))
            fi
            # El cuerpo SIEMPRE, también cuando pasa: es lo único que distingue
            # una excepción nuestra de un error de la plataforma, y cuando algo
            # se tuerce uno quiere poder comparar con el sondeo de ayer.
            di "     $(head -c 500 /tmp/r)"
          }

          {
            echo "### Lo publicado, pieza por pieza"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          mirar "el Worker corre"       200 GET  "/api/salud"
          mirar "lee sus reglas"        200 GET  "/api/terminos"
          mirar "LA BASE contesta"      200 GET  "/api/socio/padrino?r=DCAZZZZZZ"
          mirar "SE DERIVA UN PIN"      401 POST "/api/socio/entrar" '{"telefono":"","pin":"418290"}'
          mirar "las dos cosas juntas"  401 POST "/api/socio/entrar" '{"telefono":"00000000","pin":"418290"}'

          # Y si algo de eso falla, POR QUÉ. La ruta de salud hace los dos medios
          # pasos que le faltan a alguien para entrar —derivar su PIN y firmar su
          # sesión— de verdad, y devuelve el mensaje de la plataforma tal cual.
          # Sin esto uno sabe que algo se rompió y no qué hacer.
          #
          # Son dos secretos distintos: derivar usa PIMIENTA_PIN y firmar usa
          # SECRETO_SESION. Si faltara el segundo, registrarse daría 500 DESPUÉS
          # de haber guardado el PIN — media cuenta hecha y sin sesión.
          curl -sS -o /tmp/pin --max-time 40 "$SITIO/api/salud?probar=pin" >/dev/null 2>&1 || true
          if grep -q '"ok":false' /tmp/pin 2>/dev/null; then
            di "❌ derivar el PIN y firmar la sesión, preguntado a la cara:"
            fallos=$((fallos + 1))
          else
            di "✅ derivar el PIN y firmar la sesión, preguntado a la cara"
          fi
          di "     $(head -c 600 /tmp/pin)"

          # El panel es al revés: aquí lo que no puede pasar es un 200. Un 302 es
          # Access mandando a identificarse, y un 503 es el Worker negándose a
          # servirlo porque la puerta está mal puesta. Los dos están bien;
          # abierto, no.
          estado=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 40 "$SITIO/panel/" || echo 000)
          if [ "$estado" = "200" ]; then
            di "❌ el panel del equipo contesta 200 SIN pasar por Access. Está abierto."
            fallos=$((fallos + 1))
          else
            di "✅ el panel pide identificarse — $estado"
          fi

          echo '```' >> "$GITHUB_STEP_SUMMARY"

          if [ "$fallos" -gt 0 ]; then
            echo "::error::$fallos pieza(s) de lo publicado no contestan lo que deben."
            exit 1
          fi
