# Genera e instala las dos contraseñas secretas del Worker, sin abrir una
# terminal.
#
# ── QUÉ SON ────────────────────────────────────────────────────────────────
#
#   SECRETO_SESION   Firma la cookie de sesión del socio. Con ella, cualquiera
#                    se fabrica una sesión a nombre de cualquier socio.
#
#   PIMIENTA_PIN     Se concatena al PIN antes de derivar el hash, y vive fuera
#                    de la base a propósito. Un PIN son seis dígitos: contra un
#                    volcado de la base robado eso se agota en minutos, haya sal
#                    o no. Sin la pimienta, ese volcado no sirve de nada.
#
# Las dos son valores al azar que NADIE tiene que ver, recordar ni escribir
# nunca. Por eso se generan aquí y se quedan en Cloudflare: no hace falta que
# pasen por el portapapeles de nadie, ni que queden en el historial de una
# terminal.
#
# ── POR QUÉ NO SOBRESCRIBE ─────────────────────────────────────────────────
#
# Este flujo instala SOLO lo que falte. Si un secreto ya está, lo deja como
# está, y es la decisión más importante de este archivo:
#
#   · Cambiar PIMIENTA_PIN ROMPE EL PIN DE TODOS LOS SOCIOS A LA VEZ. Los hash
#     guardados se derivaron con la pimienta vieja y con la nueva no cuadra
#     ninguno. Nadie podría entrar, y la única salida sería que una vendedora
#     reiniciara el PIN de cada socio, uno por uno, con cada uno delante. No hay
#     forma de deshacerlo: la pimienta vieja no está escrita en ningún sitio.
#     Por eso desde aquí NO se puede rotar, ni con confirmación. El día que
#     haga falta, es una migración pensada, no un botón.
#
#   · Cambiar SECRETO_SESION solo cierra las sesiones abiertas. Molesto pero
#     inofensivo: cada socio vuelve a entrar con su PIN. Eso sí se puede hacer
#     desde aquí, marcando la casilla, y sirve si alguna vez se sospecha que el
#     valor se filtró.
#
# ── CÓMO SE USA ────────────────────────────────────────────────────────────
#
# Pestaña Actions → «Poner los secretos del Worker» → Run workflow.
# Se usa UNA VEZ. Volver a lanzarlo no hace nada y lo dice.

name: Poner los secretos del Worker

on:
  workflow_dispatch:
    inputs:
      rotar_sesion:
        description: 'Rotar SECRETO_SESION (cierra las sesiones de todos los socios; NO afecta a los PIN)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: secretos
  cancel-in-progress: false

jobs:
  poner:
    name: Generar e instalar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Comprobar la llave y resolver la cuenta
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CUENTA_SECRETO: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Falta el secreto CLOUDFLARE_API_TOKEN del repositorio."
            echo "Es el mismo que usa el flujo de desplegar. Está explicado en el README."
            exit 1
          fi

          CUENTA=$(grep -o '"account_id"[[:space:]]*:[[:space:]]*"[^"]*"' wrangler.jsonc \
            | head -1 | sed 's/.*"\([^"]*\)"$/\1/')
          [ -z "$CUENTA" ] && CUENTA="$CUENTA_SECRETO"

          if [ -z "$CUENTA" ]; then
            echo "::error::No se sabe a qué cuenta de Cloudflare apuntar."
            echo "Guarda CLOUDFLARE_ACCOUNT_ID como secreto del repositorio."
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$CUENTA" >> "$GITHUB_ENV"

      # Qué hay ya puesto. Se mira ANTES de generar nada: generar un valor que
      # después no se va a usar es ruido, y aquí el ruido se parece demasiado a
      # «te acabo de cambiar la pimienta».
      - name: Qué hay puesto ya
        id: estado
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          LISTA=$(npx wrangler secret list 2>/dev/null || echo '[]')
          echo "$LISTA"

          tiene() { echo "$LISTA" | grep -q "\"$1\""; }

          if tiene SECRETO_SESION; then echo "sesion=si" >> "$GITHUB_OUTPUT"; else echo "sesion=no" >> "$GITHUB_OUTPUT"; fi
          if tiene PIMIENTA_PIN;   then echo "pimienta=si" >> "$GITHUB_OUTPUT"; else echo "pimienta=no" >> "$GITHUB_OUTPUT"; fi

      # ---------------------------------------------------------------------
      # PIMIENTA_PIN — solo si no está. Nunca se sobrescribe.
      # ---------------------------------------------------------------------
      - name: Instalar PIMIENTA_PIN
        if: steps.estado.outputs.pimienta == 'no'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          openssl rand -base64 32 | npx wrangler secret put PIMIENTA_PIN
          echo "::notice::PIMIENTA_PIN instalada."

      - name: PIMIENTA_PIN ya estaba
        if: steps.estado.outputs.pimienta == 'si'
        run: |
          echo "::notice::PIMIENTA_PIN ya estaba puesta y NO se toca."
          echo "Cambiarla rompería el PIN de todos los socios a la vez, sin vuelta atrás:"
          echo "los hash guardados se derivaron con la pimienta vieja, que no está escrita"
          echo "en ningún sitio. Este flujo no la rota ni con confirmación."

      # ---------------------------------------------------------------------
      # SECRETO_SESION — si no está, o si se pidió rotarlo a propósito.
      # ---------------------------------------------------------------------
      - name: Instalar SECRETO_SESION
        if: steps.estado.outputs.sesion == 'no' || inputs.rotar_sesion
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          openssl rand -base64 32 | npx wrangler secret put SECRETO_SESION
          if [ "${{ steps.estado.outputs.sesion }}" = "si" ]; then
            echo "::warning::SECRETO_SESION ROTADO. Todos los socios tendrán que volver a entrar con su PIN."
          else
            echo "::notice::SECRETO_SESION instalado."
          fi

      - name: SECRETO_SESION ya estaba
        if: steps.estado.outputs.sesion == 'si' && !inputs.rotar_sesion
        run: echo "::notice::SECRETO_SESION ya estaba puesto y se deja como está."

      # ---------------------------------------------------------------------
      - name: Qué queda
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          {
            echo "### Secretos del Worker"
            echo ""
            npx wrangler secret list 2>/dev/null | grep -o '"name": *"[^"]*"' \
              | sed 's/.*"\([^"]*\)"$/- ✅ `\1`/' || echo "- (no se pudo listar)"
            echo ""
            echo "Los dos valores son aleatorios y **nadie tiene que verlos ni recordarlos**."
            echo "Viven solo en Cloudflare."
            echo ""
            echo "#### Lo que falta para que el panel del equipo se abra"
            echo ""
            echo "Crear la aplicación en Cloudflare Access sobre este Worker, con la"
            echo "**ruta \`panel\`**, y copiar su *Team domain* y su *AUD Tag* a"
            echo "\`ACCESO_DOMINIO\` y \`ACCESO_AUD\` de \`wrangler.jsonc\`."
            echo ""
            echo "La app de los socios no depende de eso y ya funciona."
          } >> "$GITHUB_STEP_SUMMARY"
