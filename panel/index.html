<!doctype html>
<html lang="es-PA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel · Socios D'CASA</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1340B1">
<link rel="icon" href="/hub/assets/logo-dcasa.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500&family=Inter:wght@400;500&display=swap">
<style>
  /* Los hex salen de datos/marca.json. verificar.mjs lo comprueba. */
  :root {
    --azul: #1340B1;
    --amarillo: #FED00F;
    --blanco: #FFFFFF;
    --hueso: #EDEAE0;
    --tinta: #141C2E;
    --apagado: #6E7686;
    --borde: #E1DDD1;
    --radio: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--hueso);
    color: var(--tinta);
    font-family: Inter, system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  header {
    background: var(--azul);
    color: var(--blanco);
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  /* El logo, no el nombre escrito. El archivo ya trae su propia placa blanca
     —el manual de marca dice que «el logo ES la placa»— así que va directo
     sobre el azul sin ningún marco nuestro detrás.

     Mucho más pequeño que en la app del socio: allí es una portada y aquí es
     una barra de trabajo que se ve doscientas veces al día. */
  header a.marca { display: flex; align-items: center; text-decoration: none; }
  header a.marca img { display: block; width: 104px; height: auto; }
  header a.marca .rotulo {
    font-family: Oswald, Inter, sans-serif;
    text-transform: uppercase;
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--blanco);
    margin-left: 12px;
    opacity: 0.85;
  }
  #quien { font-family: Oswald, Inter, sans-serif; font-size: 13px; opacity: 0.9; }

  main { max-width: 640px; margin: 0 auto; padding: 18px 16px 64px; }

  /* ---------------------------------------------------------------------
     ESCRITORIO
     El panel se escribió para el móvil, que es donde se usa en la tienda. A
     1280px eso dejaba una columna de 640px en medio de la pantalla y el 50 %
     del ancho en blanco: la vendedora tecleaba una venta sin ver el total y
     tenía que bajar para saber cuánto cobrar.
     Esto no «estira» la columna: reparte el contenido en el ancho que hay.
     --------------------------------------------------------------------- */
  @media (min-width: 900px) {
    main { max-width: 1100px; padding: 24px 24px 72px; }

    /* La venta, en dos columnas: lo que se teclea a la izquierda, el total
       pegado arriba a la derecha mientras se teclea. */
    .venta-doble {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(300px, 1fr);
      gap: 18px;
      align-items: start;
    }
    .venta-doble > h1,
    .venta-doble > .volver-ancho { grid-column: 1 / -1; }
    .venta-derecha { position: sticky; top: 24px; }

    /* El comprobante NO se ensancha: es un documento, y una línea de texto de
       mil píxeles no se lee. Se queda a ancho de papel y centrado. */
    .papel { max-width: 720px; margin-left: auto; margin-right: auto; }
    .sin-imprimir { max-width: 720px; margin-left: auto; margin-right: auto; }

    /* Las listas largas se reparten en rejilla, no en columnas de texto.
       `columns: 2` llena la primera columna entera antes de pasar a la
       segunda: para una lista alfabética eso obliga a leer hacia abajo y
       volver arriba. Una rejilla se lee de izquierda a derecha, como todo lo
       demás. */
    .lista-resultados {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 0 18px;
      align-content: start;
    }
    /* El paginador y el aviso de lista vacía ocupan el ancho entero: son de la
       lista, no un elemento más de ella. */
    .lista-resultados > .paginas,
    .lista-resultados > .nota,
    .lista-resultados > .aviso { grid-column: 1 / -1; }
  }

  /* En pantallas muy anchas, tres tarjetas por fila en la portada y en los
     reportes. Lo hace `auto-fit`, que ya estaba: solo hacía falta el ancho. */
  @media (min-width: 1200px) {
    main { max-width: 1240px; }
  }

  .tarjeta {
    background: var(--blanco);
    border: 1px solid var(--borde);
    border-radius: var(--radio);
    padding: 20px 18px;
    margin-bottom: 14px;
  }
  .tarjeta.centrada { text-align: center; }

  h1 {
    font-family: Anton, Inter, sans-serif;
    font-weight: 400;
    text-transform: uppercase;
    font-size: 26px;
    line-height: 1.05;
    margin: 0 0 12px;
    color: var(--azul);
  }
  h2 {
    font-family: Oswald, Inter, sans-serif;
    font-weight: 500;
    font-size: 17px;
    margin: 0 0 12px;
    color: var(--azul);
  }
  .antetitulo {
    font-family: Oswald, Inter, sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 12px;
    color: var(--apagado);
    margin: 0 0 8px;
  }
  p { margin: 0 0 12px; }
  .nota { color: var(--apagado); font-size: 15px; }
  .grande { font-size: 19px; }

  /* Atajos de la portada */
  .rejilla { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .atajo {
    display: block;
    text-align: left;
    background: var(--blanco);
    border: 1px solid var(--borde);
    border-radius: var(--radio);
    padding: 18px;
    font: inherit;
    color: var(--tinta);
    cursor: pointer;
    width: 100%;
  }
  .atajo:hover { border-color: var(--azul); }
  .atajo.pendiente { opacity: 0.5; cursor: default; }
  .atajo .titulo { display: block; font-family: Oswald, Inter, sans-serif; font-size: 17px; color: var(--azul); margin-bottom: 4px; }
  .atajo .texto { display: block; font-size: 15px; color: var(--apagado); }

  /* Campos. 17 px o más: por debajo, Safari en iPhone hace zoom al enfocar. */
  .campo { display: block; margin-bottom: 14px; }
  .campo .etiqueta { display: block; font-family: Oswald, Inter, sans-serif; font-size: 14px; letter-spacing: 0.04em; margin-bottom: 6px; }
  .campo input {
    width: 100%;
    font: inherit;
    font-size: 17px;
    padding: 13px 14px;
    border: 1px solid var(--borde);
    border-radius: 10px;
    background: var(--blanco);
    color: var(--tinta);
  }
  .campo input:focus { outline: 3px solid var(--azul); outline-offset: 1px; border-color: var(--azul); }
  .campo .nota { display: block; margin-top: 5px; font-size: 13px; }

  /* El selector de cumpleaños: dos listas, un toque cada una.
     Ver `hub/cumple.js` para el porqué de que no sea un calendario. */
  .cumple-fila { display: flex; gap: 10px; }
  .cumple-parte {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 17px;
    /* 48px de alto mínimo: es un objetivo que se toca con el pulgar, de pie. */
    padding: 13px 12px;
    border: 1px solid var(--borde);
    border-radius: 10px;
    background: var(--blanco);
    color: var(--tinta);
    /* La flecha nativa de Android ocupa y desalinea; se pinta una propia. */
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--azul) 50%),
                      linear-gradient(135deg, var(--azul) 50%, transparent 50%);
    background-position: right 18px center, right 13px center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    padding-right: 32px;
  }
  .cumple-parte:focus { outline: 3px solid var(--azul); outline-offset: 1px; border-color: var(--azul); }
  /* La fecha releída en palabras. Vacía no ocupa: sin esto el formulario da un
     salto de un renglón la primera vez que se elige un día. */
  .cumple-leido:not(:empty) { display: block; margin-top: 6px; font-weight: 500; color: var(--azul); }

  /* Resultados de la búsqueda */
  .resultados { margin-top: 4px; }
  .resultado {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: 0;
    border-top: 1px solid var(--borde);
    padding: 13px 2px;
    font: inherit;
    cursor: pointer;
  }
  .resultado .nombre { display: block; font-family: Oswald, Inter, sans-serif; font-size: 17px; color: var(--azul); }
  .resultado .meta { display: block; font-size: 14px; color: var(--apagado); }
  .resultado .marca { display: inline-block; font-size: 12px; border: 1px solid var(--apagado); border-radius: 999px; padding: 0 8px; margin-top: 4px; color: var(--apagado); }
  .vacio { padding: 12px 2px 0; }

  /* El socio ya elegido, en el formulario de compra */
  .elegido { background: var(--hueso); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; }
  .elegido .nombre { display: block; font-family: Oswald, Inter, sans-serif; font-size: 17px; }
  .elegido .meta { display: block; font-size: 14px; color: var(--apagado); }
  .cambiar { background: none; border: 0; padding: 4px 0 0; font: inherit; font-size: 14px; color: var(--azul); text-decoration: underline; cursor: pointer; }

  /* El anticipo: lo que la vendedora ve antes de confirmar */
  .anticipo { min-height: 26px; font-size: 17px; color: var(--azul); }
  .anticipo b { font-family: Oswald, Inter, sans-serif; }

  /* Placa amarilla con texto AZUL. Amarillo sobre blanco da 1.47:1 y está
     prohibido. */
  .placa { background: var(--amarillo); color: var(--azul); border-radius: var(--radio); padding: 18px 14px 14px; margin: 8px 0 14px; }
  .placa .numero { display: block; font-family: Anton, Inter, sans-serif; font-size: 54px; line-height: 0.94; }
  .placa .unidad { display: block; font-family: Oswald, Inter, sans-serif; text-transform: uppercase; letter-spacing: 0.18em; font-size: 12px; margin-top: 5px; }
  .placa.chica .numero { font-size: 38px; }

  /* El PIN temporal, que se enseña una sola vez */
  .pin-nuevo { background: var(--hueso); border: 2px solid var(--azul); border-radius: var(--radio); padding: 16px; margin-bottom: 14px; text-align: center; }
  .pin-nuevo .pin { display: block; font-family: ui-monospace, Menlo, monospace; font-size: 38px; letter-spacing: 0.22em; color: var(--azul); margin: 6px 0; }

  .boton {
    display: block;
    width: 100%;
    text-align: center;
    background: var(--amarillo);
    color: var(--azul);
    font-family: Oswald, Inter, sans-serif;
    font-weight: 500;
    font-size: 16px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 15px 18px;
    border-radius: var(--radio);
    border: 2px solid var(--azul);
    margin-top: 10px;
    cursor: pointer;
  }
  .boton.secundario { background: transparent; }
  .boton[disabled] { opacity: 0.55; cursor: progress; }

  .fila {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: 0;
    border-bottom: 1px solid var(--borde);
    padding: 14px 2px;
    font: inherit;
    color: var(--azul);
    cursor: pointer;
  }
  .fila:last-child { border-bottom: 0; }
  .enlace-accion { background: none; border: 0; padding: 6px 0 0; font: inherit; font-size: 14px; color: var(--azul); text-decoration: underline; cursor: pointer; }

  /* El rojo de alarma no existe en esta marca: los stickers rojos son el
     mercado del que D'CASA se separa. Se usa el azul con un borde grueso. */
  .aviso { border-radius: 10px; padding: 11px 14px; font-size: 15px; margin: 12px 0 0; background: var(--hueso); border-left: 5px solid var(--azul); }
  .aviso.espera { border-left-color: var(--apagado); }

  .codigo-chico { font-family: ui-monospace, Menlo, monospace; font-size: 16px; letter-spacing: 0.12em; color: var(--azul); }
  #codigo { font-family: ui-monospace, Menlo, monospace; font-size: 24px; letter-spacing: 0.18em; text-align: center; text-transform: uppercase; }

  /* Fila de cifras. Los números grandes van en proporcionales, no en
     `tabular-nums`: los dígitos de ancho fijo hacen que «121» se vea suelto a
     tamaño de titular. El ancho fijo se reserva para donde los números se
     alinean en columna, que aquí es el valor de cada barra. */
  .cifras { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .cifra { background: var(--blanco); border: 1px solid var(--borde); border-radius: var(--radio); padding: 16px; }
  /* La cifra que sustituye a un gráfico va sin caja: dentro de una tarjeta, una
     caja dentro de otra es un marco de más. Y separada de la nota que la sigue,
     o las dos líneas se leen como un párrafo. */
  .cifra.sin-caja { background: none; border: 0; padding: 0; margin-bottom: 10px; }
  .cifra-titulo { display: block; font-family: Oswald, Inter, sans-serif; font-size: 13px; letter-spacing: 0.04em; color: var(--apagado); margin-bottom: 4px; }
  .cifra-valor { display: block; font-family: Anton, Inter, sans-serif; font-size: 32px; line-height: 1.05; color: var(--azul); }
  .cifra-unidad { display: block; font-size: 13px; color: var(--apagado); margin-top: 2px; }

  /* Barras horizontales. Un solo tono: el largo ya dice quién emite más, y
     teñir la más larga de otro color sería decidir por quien mira que eso está
     mal — cuando puede ser la vendedora que más vende. */
  .barras { list-style: none; padding: 0; margin: 0; }
  .barras li { padding: 12px 0; }
  .barras li:focus-visible { outline: 3px solid var(--azul); outline-offset: 2px; border-radius: 8px; }
  .barra-cabeza { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 5px; }
  .barra-nombre { font-family: Oswald, Inter, sans-serif; font-size: 16px; }
  /* Aquí sí `tabular-nums`: estos números se alinean en columna y con ancho
     variable el ojo no los puede comparar de un vistazo. */
  .barra-valor { font-family: Anton, Inter, sans-serif; font-size: 18px; color: var(--azul); font-variant-numeric: tabular-nums; }
  /* El riel es el fondo, un tono por encima de la superficie. Sin rejilla: con
     el número escrito al lado de cada barra, una rejilla solo añadiría ruido. */
  .barra-riel { background: var(--hueso); border-radius: 4px; height: 10px; overflow: hidden; }
  /* Extremo del dato redondeado, base cuadrada: la barra nace del cero y crece
     hacia la derecha, y redondear el arranque haría que pareciera flotar. */
  .barra { height: 100%; background: var(--azul); border-radius: 0 4px 4px 0; }

  /* Columnas de altas por semana. Mismo criterio: un tono, sin rejilla. */
  .columnas { list-style: none; padding: 0; margin: 14px 0 10px; display: flex; gap: 6px; align-items: flex-end; }
  /* Tope de ancho: con tres o cuatro semanas, `flex: 1` a secas convierte cada
     columna en un bloque enorme que no se lee como un gráfico. */
  .columnas li { flex: 1; max-width: 64px; text-align: center; min-width: 0; }
  .col-valor { display: block; font-family: Anton, Inter, sans-serif; font-size: 15px; color: var(--azul); margin-bottom: 4px; }
  .col-riel { height: 70px; display: flex; align-items: flex-end; }
  .col { width: 100%; background: var(--azul); border-radius: 4px 4px 0 0; }
  .col-etiqueta { display: block; font-size: 11px; color: var(--apagado); margin-top: 5px; font-variant-numeric: tabular-nums; }

  .enlace-accion.sin-margen { padding: 0; }

  .lista { list-style: none; padding: 0; margin: 0; }
  .lista li { border-bottom: 1px solid var(--borde); padding: 12px 0; }
  .lista li:last-child { border-bottom: 0; }
  .lista li.anulada { opacity: 0.55; }
  .linea { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .puntos { font-family: Anton, Inter, sans-serif; font-size: 18px; color: var(--azul); white-space: nowrap; }
  .puntos.resta { color: var(--apagado); }
  .cuando { font-size: 13px; color: var(--apagado); }
  .motivo { font-size: 14px; background: var(--hueso); border-radius: 8px; padding: 8px 11px; margin: 8px 0 0; }
  .nota-grande h2 { margin-bottom: 8px; }
  /* El recordatorio de configuración: un renglón discreto al pie, no una
     tarjeta que compite con la lista de clientes. */
  .nota.recordatorio { margin-top: 18px; text-align: center; }

  /* ---------------------------------------------------------------------
     LA AYUDA EMERGENTE
     Ver `hub/ayuda.js` para el porqué de que no sea un `title`.
     --------------------------------------------------------------------- */

  .ayuda { position: relative; display: inline-block; vertical-align: middle; }

  /* El círculo se ve de 20px, pero se toca en 44. El área táctil la pone el
     ::after, que es transparente y se sale del círculo: agrandar el círculo de
     verdad convertiría un signo de ayuda en el elemento más gordo del
     renglón. 44px es el mínimo de la pauta de accesibilidad y el ancho real de
     la yema de un pulgar. */
  .ayuda-boton {
    position: relative;
    display: block;
    width: 20px;
    height: 20px;
    padding: 0;
    border: 1px solid var(--borde);
    border-radius: 50%;
    background: var(--blanco);
    color: var(--apagado);
    font: inherit;
    font-size: 12px;
    line-height: 18px;
    text-align: center;
    cursor: pointer;
  }
  .ayuda-boton::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    transform: translate(-50%, -50%);
  }
  .ayuda-boton:hover, .ayuda-boton[aria-expanded='true'] {
    border-color: var(--azul);
    color: var(--azul);
  }
  .ayuda-boton:focus-visible { outline: 3px solid var(--azul); outline-offset: 2px; }

  .ayuda-globo {
    position: absolute;
    z-index: 20;
    top: calc(100% + 8px);
    /* Anclado a la IZQUIERDA del «?» y limitado al ancho de la ventana menos
       los márgenes: a 360px, un globo centrado se sale por un lado u otro
       según dónde caiga el signo. */
    left: 0;
    width: max-content;
    max-width: min(280px, calc(100vw - 48px));
    padding: 11px 13px;
    border-radius: 10px;
    background: var(--tinta);
    color: var(--blanco);
    font-family: Inter, system-ui, sans-serif;
    font-size: 14px;
    font-weight: 400;
    line-height: 1.45;
    letter-spacing: 0;
    text-transform: none;
    text-align: left;
    white-space: normal;
    box-shadow: 0 8px 24px rgba(20, 28, 46, 0.22);
  }
  /* Si el globo se sale por un lado, lo empuja `acomodar()` en hub/ayuda.js,
     midiendo al abrir. Aquí no se adivina: la versión anterior lo intentaba con
     `:nth-last-child` y mandaba globos fuera de la pantalla. */

  /* ---------------------------------------------------------------------
     LA FACTURERÍA
     --------------------------------------------------------------------- */

  /* Un renglón de la venta: el artículo arriba, ancho entero, y debajo la
     cantidad y el precio. En 390 px los tres en fila dejan la descripción en
     ocho caracteres, que es justo el dato que hay que poder leer. */
  .renglon-venta { border-top: 1px solid var(--borde); padding: 12px 0 4px; }
  .renglon-venta:first-of-type { border-top: 0; }
  .renglon-venta > input {
    width: 100%; font: inherit; font-size: 16px; padding: 11px 12px;
    border: 1px solid var(--borde); border-radius: 10px;
    background: var(--blanco); color: var(--tinta);
  }
  .renglon-cifras { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .renglon-cifras input {
    font: inherit; font-size: 16px; padding: 10px 10px; min-width: 0;
    border: 1px solid var(--borde); border-radius: 10px;
    background: var(--blanco); color: var(--tinta);
    font-variant-numeric: tabular-nums;
  }
  .renglon-cifras input:nth-of-type(1) { width: 62px; text-align: center; }
  .renglon-cifras input:nth-of-type(2) { flex: 1; }
  .renglon-cifras .x { color: var(--apagado); font-size: 15px; }
  .renglon-venta input:focus, .renglon-cifras input:focus {
    outline: 3px solid var(--azul); outline-offset: 1px; border-color: var(--azul);
  }
  /* Separado del resto por su margen: es lo único del renglón que borra algo. */
  .quitar {
    flex: none; width: 40px; height: 40px; border-radius: 10px; margin-left: 4px;
    border: 1px solid var(--borde); background: var(--hueso);
    color: var(--apagado); font-size: 15px; cursor: pointer;
  }

  /* Los totales. En columnas alineadas por la derecha y con cifras de ancho
     fijo: es lo único de esta pantalla que se lee comparando renglones. */
  /* La misma fila en los dos sitios que la usan: la pantalla de venta y el
     comprobante. Estaba escrita solo para `.totales`, y en el papel salía el
     importe pegado a su etiqueta. */
  .total-fila {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; padding: 7px 0;
  }
  .total-que { color: var(--apagado); font-size: 15px; }
  .total-cuanto { font-variant-numeric: tabular-nums; font-size: 17px; }
  .total-fila.grande { border-top: 1px solid var(--borde); margin-top: 6px; padding-top: 12px; }
  .total-fila.grande .total-que { color: var(--tinta); font-family: Oswald, Inter, sans-serif; text-transform: uppercase; letter-spacing: 0.06em; font-size: 14px; }
  .total-fila.grande .total-cuanto { font-family: Anton, Inter, sans-serif; font-size: 30px; color: var(--azul); }
  .total-entrada { display: flex; align-items: center; gap: 6px; }
  .total-entrada span { color: var(--apagado); }
  .total-entrada input {
    width: 104px; font: inherit; font-size: 16px; padding: 8px 10px; text-align: right;
    border: 1px solid var(--borde); border-radius: 10px; background: var(--blanco);
    color: var(--tinta); font-variant-numeric: tabular-nums;
  }
  .puntos-anticipo {
    margin: 10px 0 0; padding: 10px 12px; border-radius: 10px;
    background: var(--amarillo); color: var(--azul);
    font-family: Oswald, Inter, sans-serif; font-size: 15px;
  }

  .premio-fila { display: flex; gap: 8px; align-items: center; }
  .premio-fila input {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 11px 12px;
    border: 1px solid var(--borde); border-radius: 10px;
    background: var(--blanco); color: var(--tinta); letter-spacing: 0.06em;
  }
  .premio-fila input:focus { outline: 3px solid var(--azul); outline-offset: 1px; border-color: var(--azul); }
  .premio-fila .boton { flex: none; margin: 0; width: auto; }

  /* El tipo de renglón. Estrecho a propósito: lo normal es «Artículo» y no
     debe robarle sitio a la cantidad ni al precio. */
  .renglon-tipo {
    flex: none; width: 96px; font: inherit; font-size: 14px; padding: 10px 6px;
    border: 1px solid var(--borde); border-radius: 10px;
    background: var(--blanco); color: var(--apagado); appearance: none; text-align: center;
  }
  .renglon-tipo:focus { outline: 3px solid var(--azul); outline-offset: 1px; border-color: var(--azul); }

  .elegido { padding: 12px 0; }
  .elegido .nombre { display: block; font-size: 18px; }
  .elegido .meta { display: block; font-size: 14px; color: var(--apagado); font-variant-numeric: tabular-nums; }

  /* ---------------------------------------------------------------------
     EL COMPROBANTE
     --------------------------------------------------------------------- */

  .papel {
    display: block; background: var(--blanco); border: 1px solid var(--borde);
    border-radius: var(--radio); padding: 22px 18px; margin-bottom: 14px;
  }
  .papel-cabecero { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; }
  .papel-logo { width: 118px; height: auto; display: block; }
  .papel-quien { text-align: right; }
  .papel-titulo {
    display: block; font-family: Oswald, Inter, sans-serif; text-transform: uppercase;
    letter-spacing: 0.08em; font-size: 12px; color: var(--apagado);
  }
  .papel-numero { display: block; font-family: Anton, Inter, sans-serif; font-size: 22px; color: var(--azul); }
  .papel-anulada {
    margin: 14px 0 0; padding: 10px 12px; border: 2px solid var(--azul); border-radius: 10px;
    color: var(--azul); font-family: Oswald, Inter, sans-serif; text-transform: uppercase;
    letter-spacing: 0.06em; font-size: 14px;
  }
  .papel-datos { display: flex; flex-wrap: wrap; gap: 16px; margin: 18px 0 0; }
  .papel-dato { display: flex; flex-direction: column; }
  .papel-etiqueta {
    font-family: Oswald, Inter, sans-serif; text-transform: uppercase;
    letter-spacing: 0.08em; font-size: 11px; color: var(--apagado);
  }
  .papel-cliente { margin: 18px 0 0; padding: 14px; background: var(--hueso); border-radius: 10px; }
  .papel-nombre { display: block; font-size: 18px; }
  .papel-meta { display: block; font-size: 14px; color: var(--apagado); }
  .papel-tabla { width: 100%; border-collapse: collapse; margin: 18px 0 0; font-size: 15px; }
  .papel-tabla th {
    text-align: left; font-family: Oswald, Inter, sans-serif; text-transform: uppercase;
    letter-spacing: 0.06em; font-size: 11px; color: var(--apagado);
    border-bottom: 1px solid var(--borde); padding: 0 0 7px;
  }
  .papel-tabla td { padding: 9px 0; border-bottom: 1px solid var(--borde); vertical-align: top; }
  .papel-tabla .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 10px; }
  .papel-totales { margin: 14px 0 0; }
  .papel-nota { margin: 14px 0 0; font-size: 14px; background: var(--hueso); border-radius: 8px; padding: 9px 12px; }

  /* Los puntos, en el papel. En amarillo porque es lo único de este
     documento que no es una cifra que el cliente ya sabía. */
  .papel-puntos { margin: 18px 0 0; padding: 14px; background: var(--amarillo); border-radius: 10px; color: var(--azul); }
  .papel-puntos-linea { display: block; font-family: Anton, Inter, sans-serif; font-size: 19px; }
  .papel-puntos-saldo { display: block; font-size: 15px; margin-top: 3px; }
  .papel-puntos-pie { display: block; font-size: 13px; margin-top: 6px; opacity: 0.85; }

  /* Arriba, al mismo cuerpo que el documento y con un borde que la separa. No
     es letra pequeña: es la línea que dice qué es este papel, y va donde se lee
     primero. Antes estaba al pie a 12px en gris. */
  .papel-legal {
    margin: 16px 0 0;
    padding: 10px 12px;
    border-left: 3px solid var(--azul);
    background: var(--hueso);
    border-radius: 0 8px 8px 0;
    font-size: 14px;
    line-height: 1.5;
  }
  .papel-legal b { color: var(--azul); }
  .papel-emisor {
    margin: 18px 0 0; padding-top: 12px; border-top: 1px solid var(--borde);
    display: flex; flex-direction: column; gap: 1px;
    font-size: 12px; color: var(--apagado);
  }
  .papel-emisor-nombre { font-size: 13px; color: var(--tinta); }
  .papel-pie { margin: 8px 0 0; font-size: 12px; color: var(--apagado); }

  /* Al imprimir se va todo menos el papel: el cabecero azul, los botones y el
     fondo. Sin esto, «Guardar como PDF» produce una captura de la aplicación
     en vez de un comprobante. */
  @media print {
    header, .sin-imprimir, .boton { display: none !important; }
    body { background: #FFFFFF; font-size: 13px; }
    main { max-width: none; padding: 0; }
    .papel { border: 0; border-radius: 0; padding: 0; }
    .papel-cliente, .papel-puntos, .papel-nota, .papel-legal { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }

  /* ---------------------------------------------------------------------
     LA LIBRETA Y LA FICHA
     --------------------------------------------------------------------- */

  .pestanas { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .pestana {
    font: inherit; font-size: 14px; padding: 8px 13px; border-radius: 999px;
    border: 1px solid var(--borde); background: var(--blanco); color: var(--apagado); cursor: pointer;
  }
  .pestana.puesta { background: var(--azul); border-color: var(--azul); color: var(--blanco); }

  .paginas { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }
  .paginas .nota { text-align: center; font-variant-numeric: tabular-nums; }

  .datos { margin: 14px 0 0; }
  .dato { display: flex; justify-content: space-between; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--borde); }
  .dato:last-child { border-bottom: 0; }
  .dato-que { color: var(--apagado); font-size: 14px; flex: none; }
  .dato-cuanto { text-align: right; word-break: break-word; }
  .notas-ficha { margin: 12px 0 0; font-size: 15px; background: var(--hueso); border-radius: 8px; padding: 10px 12px; }

  .rejilla.chica { grid-template-columns: 1fr; gap: 8px; }
  .resultado.sin-pulsar { cursor: default; }
  .marca.suave { background: var(--hueso); color: var(--azul); }

  .movimiento { display: flex; gap: 10px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--borde); }
  .movimiento:last-child { border-bottom: 0; }
  .mov-cuando { font-size: 13px; color: var(--apagado); flex: none; width: 92px; }
  .mov-que { flex: 1; font-size: 15px; min-width: 0; }
  .mov-cuanto { font-family: Anton, Inter, sans-serif; font-size: 17px; font-variant-numeric: tabular-nums; flex: none; }
  .mov-cuanto.mas { color: var(--azul); }
  .mov-cuanto.menos { color: var(--apagado); }

  /* Lo que no se deshace lleva borde, no color de alarma: el rojo no existe en
     esta marca (ver el comentario del aviso en index.html). */
  .tarjeta.peligro { border: 2px solid var(--azul); }
  .boton.peligro { background: var(--blanco); color: var(--azul); border: 2px solid var(--azul); }
  .boton.chico { padding: 10px 14px; font-size: 14px; }
</style>
